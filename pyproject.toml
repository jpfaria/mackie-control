[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mackie-control"
version = "0.2.0"
description = "Mackie Control surfaces driving any gear: protocol, surface profiles, and a bridge with one driver per device"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mido>=1.3", "python-rtmidi>=1.5", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest"]
hd8 = ["quantum-hd8 @ git+https://github.com/jpfaria/quantum-hd8"]

[project.scripts]
mackie = "mackie.cli:main"

[tool.setuptools.packages.find]
include = ["mackie*"]
